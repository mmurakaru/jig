[project]
name = "jig-evals"
version = "0.1.0"
description = "Harbor eval suite for jig workflows"
requires-python = ">=3.12"
dependencies = ["harbor==0.24.0"]

[project.scripts]
jig-evals = "jig_evals.eval_suite:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pyyaml==6.0.3"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jig_evals"]

[tool.pytest.ini_options]
testpaths = ["jig_evals"]
python_files = ["*_test.py"]
